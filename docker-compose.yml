services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - CACHE_TTL=300
      - RATE_LIMIT_MAX=60
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
